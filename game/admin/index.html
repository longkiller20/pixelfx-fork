<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Quản trị · Đa Vũ Trụ Tu Tiên</title>
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<section id="login" class="screen center" hidden>
  <form id="loginForm" class="box">
    <span class="logo big" aria-hidden="true">道</span>
    <h1>Quản trị</h1>
    <p class="dim">Đa Vũ Trụ Tu Tiên</p>
    <label>Tài khoản <input id="lUser" autocomplete="username" required></label>
    <label>Mật khẩu <input id="lPass" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Đăng nhập</button>
    <p class="err" id="lErr" role="alert"></p>
  </form>
</section>

<section id="pw" class="screen center" hidden>
  <form id="pwForm" class="box">
    <h1>Đổi mật khẩu</h1>
    <p class="note" id="pwNote">Đây là lần đăng nhập đầu tiên với mật khẩu mặc định: hãy đặt mật khẩu mới để tiếp tục.</p>
    <label>Mật khẩu hiện tại <input id="pwOld" type="password" autocomplete="current-password" required></label>
    <label>Mật khẩu mới (8-72 ký tự) <input id="pwNew" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
    <label>Nhập lại mật khẩu mới <input id="pwNew2" type="password" autocomplete="new-password" required></label>
    <button class="primary" type="submit">Lưu mật khẩu mới</button>
    <button type="button" id="pwCancel" class="ghost" hidden>Để sau</button>
    <p class="err" id="pwErr" role="alert"></p>
  </form>
</section>

<section id="app" class="screen" hidden>
  <!-- a sidebar on a computer; on a phone a bar on top with the sections as a row that scrolls sideways -->
  <aside id="side">
    <div class="brand"><span class="logo" aria-hidden="true">道</span><div><b>Quản trị</b><small>Đa Vũ Trụ Tu Tiên</small></div></div>
    <nav id="tabs">
      <span class="navgroup">Tổng quát</span>
      <button data-tab="overview"><i aria-hidden="true">📊</i><span>Tổng quan</span></button>
      <button data-tab="players"><i aria-hidden="true">👥</i><span>Người chơi</span></button>
      <span class="navgroup">Nội dung game</span>
      <button data-tab="realms"><i aria-hidden="true">🏔️</i><span>Cảnh giới</span></button>
      <button data-tab="items"><i aria-hidden="true">💊</i><span>Vật phẩm</span></button>
      <button data-tab="arts"><i aria-hidden="true">📜</i><span>Công pháp</span></button>
      <button data-tab="sects"><i aria-hidden="true">🏯</i><span>Tông môn</span></button>
      <button data-tab="drops"><i aria-hidden="true">🎁</i><span>Rơi đồ</span></button>
      <button data-tab="monsters"><i aria-hidden="true">👹</i><span>Yêu thú</span></button>
      <button data-tab="skills"><i aria-hidden="true">⚔️</i><span>Đánh thường</span></button>
      <button data-tab="houses"><i aria-hidden="true">🏡</i><span>Nhà Ở</span></button>
      <button data-tab="cosmetics"><i aria-hidden="true">👘</i><span>Tóc, áo, vũ khí &amp; phi kiếm</span></button>
      <span class="navgroup">Hệ thống</span>
      <button data-tab="settings"><i aria-hidden="true">⚙️</i><span>Cài đặt</span></button>
      <button data-tab="admins"><i aria-hidden="true">🛡️</i><span>Admin</span></button>
      <button data-tab="log"><i aria-hidden="true">🧾</i><span>Nhật ký</span></button>
    </nav>
    <div class="me">
      <span class="avatar" aria-hidden="true">👤</span>
      <div class="who"><b id="who"></b><small>Quản trị viên</small></div>
      <button id="myPw" class="ghost icon" title="Đổi mật khẩu" aria-label="Đổi mật khẩu">🔑</button>
      <button id="logout" class="ghost icon" title="Thoát" aria-label="Thoát">⏻</button>
    </div>
  </aside>
  <main id="main"></main>
</section>
<div id="modal" hidden><div id="modalBox" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<script type="module" src="/admin.js"></script>
</body>
</html>
