<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Bảng điều khiển VPS</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- đăng nhập -->
  <main id="login" class="login" hidden>
    <form id="loginForm" class="card loginCard" autocomplete="on">
      <div class="brand big"><span class="logo" aria-hidden="true"></span><div><b>Đa Vũ Trụ Tu Tiên</b><small>Bảng điều khiển VPS</small></div></div>
      <label>Tên đăng nhập<input name="user" autocomplete="username" required autofocus></label>
      <label>Mật khẩu<input name="pass" type="password" autocomplete="current-password" required></label>
      <p class="err" id="loginErr" hidden></p>
      <button class="btn primary wide" type="submit">Đăng nhập</button>
      <p class="hint">Quên mật khẩu? Đăng nhập SSH vào VPS rồi chạy <code>sudo dvtt-panel passwd</code>.</p>
    </form>
  </main>

  <!-- ứng dụng -->
  <div id="app" class="app" hidden>
    <aside class="side">
      <div class="brand"><span class="logo" aria-hidden="true"></span><div><b>Đa Vũ Trụ Tu Tiên</b><small>Bảng điều khiển VPS</small></div></div>
      <nav id="nav" class="nav"></nav>
      <div class="sideFoot">
        <span id="whoami" class="muted"></span>
        <button class="btn ghost small" id="logoutBtn" type="button">Đăng xuất</button>
      </div>
    </aside>
    <section class="main">
      <header class="top">
        <h1 id="viewTitle">Tổng quan</h1>
        <div class="topRight">
          <button id="taskChip" class="taskChip" type="button" hidden><span class="spin"></span><span id="taskChipText"></span></button>
          <button class="btn ghost small" id="refreshBtn" type="button" title="Tải lại">↻</button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </section>
  </div>

  <!-- tác vụ đang chạy: log trực tiếp -->
  <div id="taskModal" class="modal" hidden>
    <div class="modalBox">
      <header class="modalHead">
        <div><b id="taskTitle"></b><small id="taskSub" class="muted"></small></div>
        <button class="btn ghost small" id="taskClose" type="button" aria-label="Đóng">✕</button>
      </header>
      <pre id="taskLog" class="console"></pre>
      <footer class="modalFoot">
        <span id="taskState" class="pill"></span>
        <span class="grow"></span>
        <label class="check small"><input type="checkbox" id="taskFollow" checked> Tự cuộn</label>
        <button class="btn danger small" id="taskStop" type="button" hidden>Dừng</button>
        <button class="btn small" id="taskDone" type="button">Đóng</button>
      </footer>
    </div>
  </div>

  <!-- hỏi lại trước khi làm việc lớn -->
  <div id="confirmModal" class="modal" hidden>
    <div class="modalBox narrow">
      <header class="modalHead"><b id="confirmTitle"></b></header>
      <div id="confirmBody" class="modalBody"></div>
      <footer class="modalFoot"><span class="grow"></span><button class="btn small" id="confirmNo" type="button">Huỷ</button><button class="btn primary small" id="confirmYes" type="button">Đồng ý</button></footer>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
